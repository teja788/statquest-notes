<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foggy Valley · Learning Arcade</title>
<link rel="stylesheet" href="kit.css">
<style>
  .goal{margin-bottom:14px}
  .stage{margin:0 auto;width:100%}
  .stage.wide{max-width:max(360px,calc((100vh - 170px) * 5 / 3))}
  .stage.tall{max-width:max(300px,calc((100vh - 300px) * 5 / 6))}
  .hud .chip b{font-family:var(--mono);font-weight:500}
  .chip.eq{flex-wrap:wrap;border-radius:14px}
  .ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%}
  .ctrl .slider{flex-wrap:wrap;flex-basis:100%;min-width:0;gap:8px}
  .ctrl .slider label{flex:1}
  .ctrl .slider .brk{flex-basis:100%;height:0}
  .ctrl .nudge{min-width:44px;min-height:44px;padding:0 12px;font-size:22px;line-height:1}
  .keys{font-size:14px;color:var(--ink-2)}
  @media (hover:none){.keys{display:none}}
  @media (max-width:899px){.hud .ctrl{order:-1}}
  @media (min-width:900px){
    .play{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
    .play .hud{flex-direction:column;align-items:stretch;margin:0}
    .play .chip{justify-content:space-between}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Arcade</a>
    <h1>Foggy Valley</h1>
    <div class="levels" id="levels"></div>
  </div>
  <div class="goal" id="goal"></div>
  <div class="play">
    <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="A foggy valley at dusk. A hiker with a lantern feels the tilt of the ground."></canvas></div>
    <div class="hud" id="hud"></div>
  </div>
</div>
<script src="kit.js"></script>
<script>
'use strict';
/* ================= The math (pure functions, also checked by ?test) ================= */
const SLUG = 'foggy-valley';
const NOTE = '../02-machine-learning/56-gradient-descent-step-by-step.html';
const PEOPLE = [[0.5, 1.4], [2.3, 1.9], [2.9, 3.2]];   // (weight, height) of the three people
const FIXED_SLOPE = 0.64;                                // levels 1 and 2 only move the intercept

// Sum of squared residuals for the line: height = intercept + slope × weight
function ssr(b, m) {
  let s = 0;
  for (const [w, h] of PEOPLE) { const r = h - (b + m * w); s += r * r; }
  return s;
}
// The gradient: dSSR/d intercept = Σ −2(h − (b + m·w)),  dSSR/d slope = Σ −2·w·(h − (b + m·w))
function grad(b, m) {
  let gb = 0, gm = 0;
  for (const [w, h] of PEOPLE) { const r = h - (b + m * w); gb += -2 * r; gm += -2 * w * r; }
  return [gb, gm];
}
// SSR is quadratic, so its curvature (Hessian) is constant: eigenvalues, eigenvectors and the least squares answer
const HESS = (() => {
  let n = 0, sw = 0, sww = 0, sh = 0, swh = 0;
  for (const [w, h] of PEOPLE) { n++; sw += w; sww += w * w; sh += h; swh += w * h; }
  const a = 2 * n, c = 2 * sw, d = 2 * sww, det = a * d - c * c, tr = a + d, root = Math.sqrt(tr * tr - 4 * det);
  const eig = [(tr + root) / 2, (tr - root) / 2];                       // steep direction, flat direction
  const vec = eig.map(l => { const s = Math.hypot(c, l - a); return [c / s, (l - a) / s]; });
  const best = [(2 * sh * d - c * 2 * swh) / det, (a * 2 * swh - c * 2 * sh) / det];   // solves H·p = (2Σh, 2Σwh)
  return { eig, vec, best };
})();

// Level 3: a made-up bumpy loss: a wide bowl with a shallow dip and a deep dip, each [depth, centre, width]
const BUMP = { A: 0.55, c: 1.5, B: 4.6, dips: [[1.9, 0.55, 0.42], [4.6, 3.0, 0.52]] };
function bumpy(x) {
  let y = BUMP.A * (x - BUMP.c) ** 2 + BUMP.B;
  for (const [d, p, s] of BUMP.dips) y -= d * Math.exp(-((x - p) ** 2) / (2 * s * s));
  return y;
}
function dBumpy(x) {
  let g = 2 * BUMP.A * (x - BUMP.c);
  for (const [d, p, s] of BUMP.dips) g += d * (x - p) / (s * s) * Math.exp(-((x - p) ** 2) / (2 * s * s));
  return g;
}
// Valley floors of a 1D loss: where the derivative crosses from minus to plus (refined by bisection)
function floorsOf(df, lo, hi) {
  const out = [];
  for (let x = lo; x < hi; x += 0.01) {
    if (df(x) < 0 && df(x + 0.01) >= 0) {
      let l = x, r = x + 0.01;
      for (let i = 0; i < 40; i++) { const mid = (l + r) / 2; if (df(mid) < 0) l = mid; else r = mid; }
      out.push((l + r) / 2);
    }
  }
  return out;
}

// Gradient descent in 1D: step size = slope × learning rate, new = old − step size.
// Ends 'done' when |step size| < tiny, 'night' after max steps, 'out' when it leaves [lo, hi].
function descend1(df, x, lr, max, lo, hi, tiny = 0.001) {
  const xs = [x];
  for (let k = 0; ; k++) {
    const step = lr * df(x);
    if (Math.abs(step) < tiny) return { xs, end: 'done' };
    if (k >= max) return { xs, end: 'night' };
    x -= step; xs.push(x);
    if (!(x >= lo && x <= hi)) return { xs, end: 'out' };
  }
}
// Gradient descent on intercept and slope together. box = [bLo, bHi, mLo, mHi].
// The floor of this valley is very flat, so its finish line is finer: both steps under 0.00004.
const TINY2 = 4e-5;
function descend2(b, m, lr, max, box, tiny = TINY2) {
  const pts = [[b, m]];
  for (let k = 0; ; k++) {
    const [gb, gm] = grad(b, m);
    if (Math.max(Math.abs(lr * gb), Math.abs(lr * gm)) < tiny) return { pts, end: 'done' };
    if (k >= max) return { pts, end: 'night' };
    b -= lr * gb; m -= lr * gm; pts.push([b, m]);
    if (!(b >= box[0] && b <= box[1] && m >= box[2] && m <= box[3])) return { pts, end: 'out' };
  }
}

// The two 1D worlds: x range on screen and the loss height at the top of the picture
const V1 = { f: b => ssr(b, FIXED_SLOPE), df: b => grad(b, FIXED_SLOPE)[0], lo: -0.75, hi: 2.65, top: 9.5, seed: 5 };
const V3 = { f: bumpy, df: dBumpy, lo: -1.2, hi: 4.2, top: 9.5, seed: 9 };
const BOTTOM = floorsOf(V1.df, V1.lo, V1.hi)[0];                              // 0.9507
const PITS = floorsOf(dBumpy, V3.lo, V3.hi).sort((a, b) => bumpy(a) - bumpy(b));  // [deep, shallow]

// Level rules and star thresholds (★★★, ★★); the slider maps 0..1000 onto a log scale
const R1 = { max: 12, flat: 0.1, stars: [4, 7], maxStride: 2 };
const R2 = { lo: 0.001, hi: 0.5, max: 25, stars: [4, 10] };
const R3 = { lr: 0.06, drops: 4, max: 200 };
const R4 = { lo: 0.001, hi: 0.08, max: 1000, stars: [140, 350], box: [-0.7, 1.7, -0.15, 1.8] };
const lrAt = (v, lo, hi) => lo * Math.pow(hi / lo, v / 1000);
const tickOf = (lr, lo, hi) => Math.round(1000 * Math.log(lr / lo) / Math.log(hi / lo));
const starsFor = (n, [t3, t2]) => n <= t3 ? 3 : n <= t2 ? 2 : 1;
const run2At = v => { const lr = lrAt(v, R2.lo, R2.hi), r = descend1(V1.df, 0, lr, R2.max, V1.lo, V1.hi); return { ...r, n: r.xs.length - 1, lr }; };
const run4At = v => { const lr = lrAt(v, R4.lo, R4.hi), r = descend2(0, 1, lr, R4.max, R4.box); return { ...r, n: r.pts.length - 1, lr }; };
// Best result any slider position can reach (scans all 1001 positions once)
function bestOf(run) {
  let best = Infinity, lr = 0;
  for (let v = 0; v <= 1000; v++) { const r = run(v); if (r.end === 'done' && r.n < best) { best = r.n; lr = r.lr; } }
  return { best, lr };
}
let best2Cache, best4Cache;
const best2 = () => best2Cache || (best2Cache = bestOf(run2At));
const best4 = () => best4Cache || (best4Cache = bestOf(run4At));
/* ================= Canvas, layout and drawing helpers ================= */
const $ = id => document.getElementById(id);
const cv = $('cv'), stage = $('stage'), hudEl = $('hud'), goalEl = $('goal'), levelsEl = $('levels');
const fogCv = document.createElement('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { ink: '#2C2C2A', ink2: '#5F5E5A', bg: '#FFF8EC', card: '#FFFFFF', coral: '#D85A30', teal: '#1D9E75', purple: '#7F77DD',
  amber: '#EF9F27', blue: '#378ADD', green: '#639922', blueSoft: '#E6F1FB', purpleInk: '#3C3489', skin: '#F2D3B3', grass: '#A8CC7A', grass2: '#8EB660' };
const FD = 'Fredoka, system-ui, sans-serif', FB = 'Nunito, system-ui, sans-serif', FH = 'Caveat, cursive', FM = '"JetBrains Mono", Consolas, monospace';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '−' : '') + s; };
const fmtLr = lr => lr.toFixed(lr < 0.1 ? 4 : 3);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixRGB = (a, b, t) => hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t)).join(',');
const mix = (a, b, t) => `rgb(${mixRGB(a, b, t)})`;
let ctx, fctx, W, H, LAY, MAP, V = V1, T = 0;

// Two fixed logical sizes: wide for laptops, tall for phones in portrait (text stays readable)
function setupCanvas() {
  stage.className = 'stage';
  const tall = stage.clientWidth < 560;
  stage.className = 'stage ' + (tall ? 'tall' : 'wide');
  if (LAY && LAY.tall === tall) return;
  [W, H] = tall ? [400, 480] : [800, 480];
  ctx = Kit.canvas(cv, W, H); fctx = Kit.canvas(fogCv, W, H);
  MAP = null;
  LAY = tall ? {
    tall, lamp: 52, hiker: 0.85, gauge: [8, 8, 196, 120], inset: [204, 8, 392, 120],
    land: [8, 200, 392, 456], sun: [236, 152, 330, 470],
    map: [8, 8, 392, 300], gauge2: [8, 312, 196, 472], inset2: [204, 312, 392, 472]
  } : {
    tall, lamp: 72, hiker: 1, gauge: [12, 12, 236, 128], inset: [564, 12, 788, 132],
    land: [12, 168, 788, 456], sun: [330, 60, 560, 470],
    map: [12, 12, 548, 468], gauge2: [562, 12, 788, 212], inset2: [562, 226, 788, 468]
  };
}
// World ↔ screen for the 1D valleys
const vx = x => LAY.land[0] + (x - V.lo) / (V.hi - V.lo) * (LAY.land[2] - LAY.land[0]);
const vy = y => LAY.land[3] - y / V.top * (LAY.land[3] - LAY.land[1]);
const xOf = sx => V.lo + (sx - LAY.land[0]) / (LAY.land[2] - LAY.land[0]) * (V.hi - V.lo);
const groundY = x => vy(V.f(x));

function seg(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
function dot(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 2 * Math.PI); }   // a circle as its own sub-path
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function paint(fill) { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); }
function ink(w = 2.5) { ctx.strokeStyle = C.ink; ctx.lineWidth = w; ctx.lineCap = ctx.lineJoin = 'round'; }
function text(s, x, y, px, fam = FD, col = C.ink, align = 'center', wt = 600) {
  ctx.font = `${wt} ${px}px ${fam}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function halo(s, x, y, px, fam = FD, align = 'center', col = C.ink) {   // text with a paper-coloured outline
  ctx.font = `600 ${px}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,248,236,.92)'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function star(x, y, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + q * Math.cos(a), y + q * Math.sin(a)); }
  ctx.closePath(); ink(1.5); paint(col);
}
function panel([x0, y0, x1, y1], title, room = x1 - x0 - 20) {
  ctx.fillStyle = C.ink; rr(x0 + 3, y0 + 3, x1 - x0, y1 - y0, 12); ctx.fill();
  rr(x0, y0, x1 - x0, y1 - y0, 12); ink(2); paint(C.card);
  let px = 21;                                   // shrink the title if a fallback font is wider than Caveat
  do ctx.font = `700 ${px}px ${FH}`; while (ctx.measureText(title).width > room && --px > 13);
  text(title, x0 + 10, y0 + 16, px, FH, C.ink2, 'left', 700);
}

/* ---- Sky, sun, land, decorations ---- */
const SKY_STARS = (() => { const r = Kit.rng(11); return Array.from({ length: 40 }, () => [r(), r() * 0.42, 0.6 + r() * 1.2]); })();
function drawSky(day) {     // day: 0 = late afternoon, 1 = night
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#F7C987', '#26215C', day)); g.addColorStop(0.6, mix('#FCE6C2', '#5B4FA0', day));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (day > 0.5) {
    ctx.fillStyle = `rgba(255,248,236,${Math.min(1, (day - 0.5) * 2.2)})`;
    for (const [sx, sy, r] of SKY_STARS) { ctx.beginPath(); ctx.arc(sx * W, sy * H, r, 0, 7); ctx.fill(); }
  }
  const [ax, ay, bx, by] = LAY.sun, t = Math.min(day, 1), x = lerp(ax, bx, t), y = lerp(ay, by, t * t), r = LAY.tall ? 15 : 21;
  ink(2.5);
  for (let i = 0; i < 8; i++) {            // rays turn slowly
    const a = i * Math.PI / 4 + (RM ? 0 : T * 0.3);
    seg(x + Math.cos(a) * (r + 5), y + Math.sin(a) * (r + 5), x + Math.cos(a) * (r + 11), y + Math.sin(a) * (r + 11));
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); paint(mix('#EF9F27', '#D85A30', t));
  ink(2); const k = r / 21;                 // a sleepy face as the sun sets
  if (t > 0.7) { seg(x - 8 * k, y - 3 * k, x - 3 * k, y - 3 * k); seg(x + 3 * k, y - 3 * k, x + 8 * k, y - 3 * k); }
  else { ctx.fillStyle = C.ink; ctx.beginPath(); dot(x - 5 * k, y - 3 * k, 2 * k); dot(x + 5 * k, y - 3 * k, 2 * k); ctx.fill(); }
  ctx.beginPath(); ctx.arc(x, y + 2 * k, 5 * k, 0.3, Math.PI - 0.3); ctx.stroke();
}
function landPath() {
  const p = new Path2D(), [x0, , x1] = LAY.land;
  p.moveTo(x0 - 10, H + 10);
  for (let sx = x0 - 10; sx <= x1 + 10; sx += 4) p.lineTo(sx, groundY(xOf(sx)));
  p.lineTo(x1 + 10, H + 10); p.closePath();
  return p;
}
function drawLand() {
  const p = landPath();
  ctx.fillStyle = C.grass; ctx.fill(p);
  ctx.save(); ctx.clip(p); ctx.translate(0, 18); ctx.fillStyle = C.grass2; ctx.fill(p); ctx.restore();
  ink(3); ctx.stroke(p);
  const d = V.decor || (V.decor = decorFor(V));
  for (const [x, k] of d.pines) pine(vx(x), groundY(x) + 3, k * LAY.hiker);
  ctx.strokeStyle = C.green; ctx.lineWidth = 2;
  for (const x of d.tufts) { const sx = vx(x), sy = groundY(x) + 2; seg(sx - 4, sy, sx - 6, sy - 7); seg(sx, sy, sx, sy - 9); seg(sx + 4, sy, sx + 6, sy - 7); }
  for (const [x, r] of d.rocks) { ctx.beginPath(); ctx.ellipse(vx(x), groundY(x) + 4, r * 1.4, r, 0, Math.PI, 0); ctx.closePath(); ink(2); paint('#CFC6B6'); }
}
function decorFor(Vc) {    // seeded so every visit looks the same; nothing sits on a valley floor
  const r = Kit.rng(Vc.seed), keep = [0, ...floorsOf(Vc.df, Vc.lo, Vc.hi)], clear = x => keep.every(f => Math.abs(x - f) > 0.35);   // start spot too
  const d = { pines: [], tufts: [], rocks: [] };
  while (d.pines.length < 6) { const x = Vc.lo + 0.1 + r() * (Vc.hi - Vc.lo - 0.2); if (clear(x)) d.pines.push([x, 0.7 + r() * 0.5]); }
  for (let x = Vc.lo + 0.05; x < Vc.hi; x += 0.12 + r() * 0.12) d.tufts.push(x);
  while (d.rocks.length < 7) { const x = Vc.lo + r() * (Vc.hi - Vc.lo); if (clear(x)) d.rocks.push([x, 3 + r() * 4]); }
  return d;
}
function pine(x, y, k) {
  ink(2); ctx.beginPath(); ctx.rect(x - 2.5 * k, y - 10 * k, 5 * k, 10 * k); paint('#8A6A45');
  for (let i = 0; i < 3; i++) {
    const w = (15 - i * 4) * k, b = y - (8 + i * 10) * k;
    ctx.beginPath(); ctx.moveTo(x - w, b); ctx.lineTo(x, b - 17 * k); ctx.lineTo(x + w, b); ctx.closePath(); paint('#4F8A3A');
  }
}

/* ---- Fog with a lantern-shaped hole; drawn on its own canvas, then laid over the scene ---- */
const WISPS = (() => { const r = Kit.rng(3); return Array.from({ length: 6 }, () => ({ x: r(), y: r(), w: 110 + r() * 150, v: 6 + r() * 10 })); })();
function drawFog(lx, ly, alpha, day, rect) {   // rect: fog only inside it (map); otherwise a bank over the land
  if (alpha <= 0.01) return;
  const f = fctx, r = LAY.lamp, col = mixRGB('#E2DCF0', '#4E4590', day * 0.75);
  f.globalCompositeOperation = 'source-over'; f.clearRect(0, 0, W, H);
  const top = rect ? rect[1] : LAY.land[1], bot = rect ? rect[3] : H;
  if (rect) { f.fillStyle = `rgb(${col})`; f.fillRect(0, 0, W, H); }
  else {                                         // opaque over the land, fading out into the sky
    const g = f.createLinearGradient(0, top - 70, 0, top + 12);
    g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(1, `rgb(${col})`);
    f.fillStyle = g; f.fillRect(0, 0, W, H);
  }
  f.fillStyle = 'rgba(255,255,255,0.2)';
  for (const w of WISPS) {
    const x = (w.x * (W + 400) + (RM ? 0 : T * w.v)) % (W + 400) - 200;
    f.beginPath(); f.ellipse(x, top + 20 + w.y * (bot - top - 30), w.w, 14, 0, 0, 7); f.fill();
  }
  f.globalCompositeOperation = 'destination-out';
  const h = f.createRadialGradient(lx, ly, r * 0.4, lx, ly, r);
  h.addColorStop(0, 'rgba(0,0,0,1)'); h.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = h; f.beginPath(); f.arc(lx, ly, r, 0, 7); f.fill();
  f.globalCompositeOperation = 'source-over';
  ctx.save();
  if (rect) { ctx.beginPath(); ctx.rect(rect[0], rect[1], rect[2] - rect[0], rect[3] - rect[1]); ctx.clip(); }
  ctx.globalAlpha = alpha; ctx.drawImage(fogCv, 0, 0, W, H);
  ctx.restore();
}
function lampGlow(x, y) {
  const r = LAY.lamp * 1.1, g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(255,214,140,0.32)'); g.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}

/* ---- The hiker (feet at x, y). o: {s, face, pose: stand|air|cheer|sit|dizzy, sx, sy, rot, sleep, chute} ---- */
function drawHiker(x, y, o) {
  const s = (o.s || 1) * LAY.hiker, pose = o.pose || 'stand', sit = pose === 'sit', cheer = pose === 'cheer';
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale((o.face || 1) * s * (o.sx || 1), s * (o.sy || 1));
  ink();
  if (o.chute) {
    ctx.lineWidth = 1.5; seg(-6, -30, -24, -72); seg(6, -30, 24, -72); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -72, 27, 20, 0, Math.PI, 0); ctx.closePath(); paint(C.coral);
    ctx.beginPath(); ctx.ellipse(0, -72, 9, 20, 0, Math.PI, 0); paint(C.bg);
  }
  if (sit) { seg(-3, -6, 9, -2); seg(3, -6, 13, -1); ctx.translate(0, 9); }
  else if (pose === 'air') { seg(-4, -14, -9, -6); seg(4, -14, 7, -7); }
  else { seg(-4, -14, -5, 0); seg(4, -14, 5, 0); }
  rr(-16, -34, 9, 18, 4); paint(C.amber);                         // backpack
  rr(-9, -36, 18, 24, 8); paint(C.coral);                         // jacket
  if (cheer) { seg(-6, -30, -13, -46); seg(6, -30, 13, -50); lantern(13, -50); }
  else { seg(-5, -29, -9, -19); seg(5, -29, 13, -24); lantern(13, -24); }
  ctx.beginPath(); ctx.arc(0, -45, 9, 0, 7); paint(C.skin);       // head
  ctx.beginPath(); ctx.arc(0, -46, 9.5, Math.PI, 0); ctx.closePath(); paint(C.teal);   // beanie
  ctx.beginPath(); ctx.arc(0, -57, 3.2, 0, 7); paint(C.amber);    // pom-pom

/* ---- Particles: dust puffs, sparkles, sleepy z's ---- */
const parts = [];
function burst(x, y, kind, n) {

    ? { kind, x, y, vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 35, t: 0, life: 0.45, r: 3 + Math.random() * 3 }
    : kind === 'spark' ? { kind, x, y, vx: (Math.random() - 0.5) * 240, vy: -90 - Math.random() * 170, t: 0, life: 1.1, r: 4 + Math.random() * 3 }
    : { kind, x, y, vx: 10, vy: -20, t: 0, life: 1.6, r: 15 });
}
function stepParts(dt) {
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'spark') p.vy += 280 * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t >= parts[i].life) parts.splice(i, 1);
}

  }

/* ---- Instruments: the tilt dial, the gauge panels, the "your line" inset ---- */

/* ================= Shared valley mechanics ================= */
let S = {};                        // the current level's state, replaced on every level start
const later = (sec, fn) => { S.timer = { t: sec, fn }; };
const say = (s, t = 1.8) => { S.say = { s, t }; };
const hopArc = d => RM ? 0 : clamp(8 + d * 0.28, 8, 110);
function hopTo(x1, done, quick) {
  const x0 = S.x, d = Math.abs(vx(x1) - vx(x0));
  S.hop = { x0, x1, t: 0, dur: RM ? 0.12 : clamp((quick ? 0.1 : 0.22) + d / 900, 0.12, 0.6), arc: hopArc(d), done };
  if (x1 !== x0) S.face = x1 > x0 ? 1 : -1;
}
function feet() {                  // screen position of the hiker's feet, mid-hop included
  const h = S.hop;
  if (!h) return [vx(S.x), groundY(S.x)];
  return [vx(lerp(h.x0, h.x1, h.t)), lerp(groundY(h.x0), groundY(h.x1), h.t) - h.arc * 4 * h.t * (1 - h.t)];
}
const curX = () => S.hop ? lerp(S.hop.x0, S.hop.x1, S.hop.t) : S.x;
function hikerLook() {             // squash and stretch

  else if (S.squash > 0) { o.sy = 1 - 0.22 * S.squash; o.sx = 1 + 0.16 * S.squash; }
  else if (S.crouch) { o.sy = 1 - 0.2 * S.crouch; o.sx = 1 + 0.14 * S.crouch; }
  else if (!RM && S.pose === 'stand') o.sy = 1 + 0.015 * Math.sin(T * 3);
  return o;
}
function tick(dt) {                // per-frame bookkeeping shared by every level
  if (S.timer && (S.timer.t -= dt) <= 0) { const f = S.timer.fn; S.timer = null; f(); }
  const h = S.hop;

    f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 700 * dt; f.rot += f.vr * dt;
    if (!f.gone && (f.x < -30 || f.x > W + 30 || f.y < -30)) { f.gone = true; burst(clamp(f.x, 12, W - 12), clamp(f.y, 12, H - 12), 'spark', 10); }
  }
  if (S.sleep && Math.random() < dt * 1.4) { const [x, y] = feet(); burst(x + 12, y - 52 * LAY.hiker, 'z', 1); }
  stepParts(dt);
}
function prints(xs, col, alpha) {  // a pair of footprints at every landing
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col;
  for (const x of xs) {
    if (!(x >= V.lo && x <= V.hi)) continue;

}
function hops(xs, col, alpha) {    // faint dashed arcs between landings
  ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash([4, 6]); ctx.lineWidth = 2; ctx.strokeStyle = col;
  for (let i = 1; i < xs.length; i++) {
    const a = xs[i - 1], b = xs[i];
    if (!(a >= V.lo && a <= V.hi && b >= V.lo && b <= V.hi)) continue;
    const ax = vx(a), ay = groundY(a), bx = vx(b), by = groundY(b), arc = hopArc(Math.abs(bx - ax));
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 - 2 * arc, bx, by); ctx.stroke();

}

/* ---- Learning-rate slider shared by levels 2 and 4 (log scale, plus nudge buttons for fine control) ---- */

    <button class="btn small nudge" data-d="1" aria-label="Bigger learning rate">+</button></div>

/* ================= Level 1: Feel your way ================= */
const clampAim = s => clamp(S.x + s, V.lo + 0.02, V.hi - 0.02) - S.x;
function pullToStride(dx) {       // slingshot: pull left to go right; quadratic, so short pulls give fine control
  const k = Math.min(Math.abs(dx), W * 0.36) / (W * 0.36);
  return clampAim(-Math.sign(dx) * R1.maxStride * k * k);
}
function aimArrow(fx, fy) {
  const tx = vx(S.x + S.aim), y = fy - 72 * LAY.hiker, hy = fy - 28 * LAY.hiker, dir = Math.sign(tx - fx) || 1;
  if (S.drag) {                    // the rubber band

    ctx.strokeStyle = C.ink2; ctx.lineWidth = 2; seg(fx - 5, hy, px, hy + 4); seg(fx + 5, hy, px, hy + 4);
    ink(2); ctx.beginPath(); ctx.arc(px, hy + 4, 7, 0, 7); paint(C.amber);

  ctx.save(); ctx.setLineDash([3, 5]); ctx.lineWidth = 2; seg(tx, y + 8, tx, y + 48); ctx.restore();
  halo(`stride ${S.aim > 0 ? '+' : ''}${fmt(S.aim)}`, clamp((fx + tx) / 2, 60, W - 60), y - 17, 17);
}
function stride() {
  const to = S.x + S.aim, before = V.df(S.x);
  S.aim = 0; S.n++; S.sun = S.n / R1.max;
  hopTo(to, () => {
    S.trail.push(S.x);
    const g = V.df(S.x);
    if (Math.abs(g) < R1.flat) {
      S.phase = 'won'; S.pose = 'cheer'; S.flag = S.x; S.lift = true;
      const [fx, fy] = feet(); burst(fx, fy - 40, 'spark', 16);

}
function result1() {
  const gd = descend1(V1.df, 0, 0.1, 100, V1.lo, V1.hi).xs.map(x => fmt(x)).join(' → ');

    <div class="lesson"><span class="lbl">What you just felt</span>Where the ground was steep you took big strides, and near the bottom you took baby steps. Gradient descent does this on its own: each step is the slope times a small learning rate, so the steps shrink as the ground flattens. The tilt on your gauge is that slope, the derivative dSSR/d intercept.</div>

}

  intro: `<p>Dusk, thick fog. The ground is the loss curve: where you stand is the line's <b>intercept</b> (its slope stays 0.64), and your height is the <b>sum of squared residuals</b>. You can't see the bottom. You can only feel the tilt under your feet.</p>

/* ================= Level 2: Autopilot ================= */
function archive2() {              // the last walk becomes a ghost trail
  if (!S.run) return;
  S.ghosts.push({ xs: S.trail, lr: S.run.lr, end: S.run.end });
  if (S.ghosts.length > 3) S.ghosts.shift();
}
function go2() {
  if (S.phase !== 'ready') return;               // a run is on, or its result card is on the way
  archive2();
  const lr = L2.lr;
  Object.assign(S, L2.fresh(), { run: { ...descend1(V1.df, 0, lr, R2.max, V1.lo, V1.hi), lr }, phase: 'run' });
  later(0.25, step2);
}
function step2() {
  const xs = S.run.xs;
  if (S.i >= xs.length - 1) return end2();
  const x1 = xs[S.i + 1];
  if (!(x1 >= V.lo && x1 <= V.hi)) return fling(x1);
  hopTo(x1, () => {
    S.i++; S.n++; S.sun = S.n / R2.max; S.trail.push(S.x);
    if ((S.x - BOTTOM) * (xs[S.i - 1] - BOTTOM) < 0 && ++S.dizzy >= 3) S.pose = 'dizzy';   // jumped over the bottom again
    later(RM ? 0.15 : 0.06, step2);
  });
}
function end2() {
  const r = S.run, n = r.xs.length - 1;
  if (r.end === 'done') {
    S.phase = 'won'; S.pose = 'cheer'; S.flag = S.x; S.lift = true;
    const [fx, fy] = feet(); burst(fx, fy - 40, 'spark', 16);
    win(starsFor(n, R2.stars), n <= 2 ? 'Straight to the bottom!' : 'Settled at the bottom', () => {
      const b = best2();

  }
};
/* ================= Game shell: levels, cards, HUD, input, loop ================= */
const LEVELS = [L1, L2, L3, L4];
let lvl = 0, L = L1, HUDV = {};

function renderBar() { Kit.levelBar(levelsEl, { count: LEVELS.length, current: lvl, game: SLUG, onPick: i => startLevel(i) }); }
function buildHud() {
  hudEl.innerHTML = ''; HUDV = {};
  for (const [k, label, cls] of L.chips) {
    const c = document.createElement('span');
    c.className = 'chip' + (cls ? ' ' + cls : '');
    c.innerHTML = `${label} <b></b>`;
    hudEl.appendChild(c); HUDV[k] = c.lastElementChild;
  }
  const ctl = document.createElement('div');
  ctl.className = 'ctrl'; hudEl.appendChild(ctl);
  L.controls(ctl);
}
function hudUpdate() { const v = L.hud(); for (const k in v) if (HUDV[k].textContent !== v[k]) HUDV[k].textContent = v[k]; }
function startLevel(i, intro = true) {
  lvl = i; L = LEVELS[i]; V = L.V || V1;
  S = L.reset(); S.sunShown = 0; parts.length = 0;
  renderBar(); goalEl.textContent = L.goal; buildHud();
  stage.style.touchAction = L.drag ? 'none' : 'pan-y';     // levels without dragging let the page scroll
  if (intro) Kit.card({ title: `${i + 1}. ${L.name}`, html: L.intro, buttons: [{ label: "Let's go" }] });
}
const again = () => (L.retry ? L.retry() : startLevel(lvl, false));   // levels 2 and 4 keep their ghost trails
function win(stars, title, html, delay) {   // stars are saved at once; the card waits for the celebration
  Kit.save(SLUG, lvl, stars); renderBar();
  later(delay, () => {
    if (stars === 3) Kit.confetti();
    const last = lvl === LEVELS.length - 1;
    Kit.card({ title, stars, html: html(), buttons: [
      { label: 'Read the note', href: NOTE },
      { label: 'Try again', onClick: again },
      last ? { label: 'Back to arcade', href: 'index.html' } : { label: 'Next level', onClick: () => startLevel(lvl + 1) }
    ] });
  });
}
function lose(title, html) {
  Kit.card({ title, html, buttons: [{ label: 'Read the note', href: NOTE }, { label: 'Try again', onClick: again }] });
}

cv.addEventListener('pointerdown', e => {
  if (!L.down) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* capture is optional */ }
  L.down(Kit.pointer(cv, e), e);
});
cv.addEventListener('pointermove', e => { if (L.move) L.move(Kit.pointer(cv, e), e); });
cv.addEventListener('pointerup', e => { if (L.up) L.up(Kit.pointer(cv, e), e); });
cv.addEventListener('pointercancel', () => { if (L.cancel) L.cancel(); });
addEventListener('keydown', e => {
  if (!L.key || document.querySelector('.overlay')) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' && e.key.startsWith('Arrow')) return;                              // the slider moves itself
  if ((tag === 'BUTTON' || tag === 'A') && (e.key === ' ' || e.key === 'Enter')) return;  // the focused control clicks itself
  L.key(e);
});
addEventListener('resize', setupCanvas);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now; T += dt;
  tick(dt);
  if (L.update) L.update(dt);
  L.draw(); hudUpdate();
  requestAnimationFrame(frame);
}

/* ================= ?test: checks of the core math, in the console only ================= */
function selfTest() {
  const bad = [], near = (a, b, tol) => Math.abs(a - b) <= tol, last = a => a[a.length - 1];
  const check = (ok, what) => { console.assert(ok, what); if (!ok) bad.push(what); };
  check(near(ssr(0, FIXED_SLOPE), 3.156, 0.001), 'SSR at intercept 0 is 3.16 (the note rounds to 3.1)');
  check(near(V1.df(0), -5.704, 1e-9), 'tilt at intercept 0 is -5.7');
  for (const [b, m] of [[0, 1], [0.3, 0.2], [1.2, 0.9]]) {
    const [gb, gm] = grad(b, m), e = 1e-6;
    check(near(gb, (ssr(b + e, m) - ssr(b - e, m)) / (2 * e), 1e-5) && near(gm, (ssr(b, m + e) - ssr(b, m - e)) / (2 * e), 1e-5), `gradient matches finite differences at (${b}, ${m})`);
  }
  for (const x of [-1, 0, 0.64, 1.6, 2.9, 4]) check(near(dBumpy(x), (bumpy(x + 1e-6) - bumpy(x - 1e-6)) / 2e-6, 1e-5), `bumpy slope matches finite differences at ${x}`);
  const r1 = descend1(V1.df, 0, 0.1, 1000, -1e9, 1e9);
  check(r1.end === 'done' && near(last(r1.xs), 0.95, 0.01), '1D: rate 0.1 from 0 reaches 0.95');
  check(near(r1.xs[1], 0.57, 0.005) && near(r1.xs[2], 0.80, 0.005), '1D: first steps land at 0.57 and 0.80, as in the note');
  const r2 = descend2(0, 1, 0.01, 2000, [-1e9, 1e9, -1e9, 1e9]), [eb, em] = last(r2.pts);
  check(r2.end === 'done' && near(eb, 0.95, 0.01) && near(em, 0.64, 0.01), '2D: rate 0.01 from (0, 1) reaches (0.95, 0.64) within 2000 steps');
  check(descend2(0, 1, 0.07, 2000, R4.box).end === 'out', '2D: rate 0.07 diverges');
  check(near(HESS.eig[0], 32.76, 0.01) && near(HESS.eig[1], 1.143, 0.001), 'Hessian eigenvalues are 32.8 and 1.14');
  check(near(HESS.best[0], 0.9487, 1e-3) && near(HESS.best[1], 0.641, 1e-3), 'least squares intercept and slope');
  check(near(BOTTOM, 0.9507, 1e-3), 'bottom of the intercept-only valley');
  const [deep, shallow] = PITS, from = x => descend1(dBumpy, x, R3.lr, R3.max, V3.lo, V3.hi);
  check(PITS.length === 2 && bumpy(deep) < bumpy(shallow) - 1, 'level 3 has two pits, one clearly deeper');
  check(from(0).end === 'done' && near(last(from(0).xs), shallow, 0.01), 'level 3: the usual start rolls into the shallow pit');
  check(near(last(from(3.8).xs), deep, 0.01), 'level 3: a far drop rolls into the deep pit');
  check(run2At(0).end === 'night' && run2At(1000).end === 'out', 'level 2: both slider ends fail (too slow, too big)');
  check(best2().best <= R2.stars[0] && best4().best <= R4.stars[0], 'three stars are reachable on levels 2 and 4');
  check(run4At(tickOf(0.062, R4.lo, R4.hi)).end !== 'done', 'level 4: a rate just above 2/λ1 never settles');
  if (bad.length) console.error('SELF-TEST FAILED', bad); else console.log('SELF-TEST PASSED');
}

if (document.fonts) ['600 20px Fredoka', '700 20px Nunito', '700 20px Caveat', '500 20px "JetBrains Mono"'].forEach(f => document.fonts.load(f).catch(() => {}));
setupCanvas();
const saved = Kit.load(SLUG).stars, firstOpen = LEVELS.findIndex((_, i) => !saved[i]);
startLevel(firstOpen < 0 ? 0 : firstOpen);
requestAnimationFrame(frame);
if (new URLSearchParams(location.search).has('test')) selfTest();
</script>
</body>
</html>
